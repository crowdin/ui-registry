name: Sync upstream

# Manually triggered from the Actions tab: refreshes registry/src/ from
# upstream shadcn and opens a PR when anything changed. The full check suite
# runs here because PRs opened with the workflow token do not trigger the CI
# workflow; close and reopen the PR to force a CI run if needed.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm sync

      - name: Check for changes
        id: check_changes
        run: |
          [ -z "$(git status --porcelain)" ] || echo "changes=true" >> "$GITHUB_OUTPUT"

      - if: steps.check_changes.outputs.changes == 'true'
        run: pnpm test
      - if: steps.check_changes.outputs.changes == 'true'
        run: pnpm validate
      - if: steps.check_changes.outputs.changes == 'true'
        run: pnpm build
      - if: steps.check_changes.outputs.changes == 'true'
        run: pnpm --dir site install --frozen-lockfile
      - if: steps.check_changes.outputs.changes == 'true'
        run: pnpm --dir site build
      - if: steps.check_changes.outputs.changes == 'true'
        run: pnpm smoke

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: sync upstream shadcn components"
          title: "chore: sync upstream shadcn components"
          body: |
            Automated upstream sync (`pnpm sync`).

            All checks passed in the sync workflow run: tests, schema
            validation, registry build, site build, and the
            install-and-compile smoke test.

            Note: CI does not run automatically on PRs opened with the
            workflow token - close and reopen this PR to trigger it.
          branch: sync-upstream
          base: main
